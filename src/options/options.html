<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Page Summarizer Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <h1>AI Page Summarizer Settings</h1>
      <form id="settingsForm">
        <label>
          <span>Local proxy URL</span>
          <input id="proxyUrl" type="url" required />
        </label>

        <label>
          <span>Default summary length</span>
          <select id="summaryMode">
            <option value="brief">3 bullets</option>
            <option value="balanced">Balanced</option>
            <option value="detailed">Detailed</option>
          </select>
        </label>

        <label class="toggle">
          <input id="highlightKeyPoints" type="checkbox" />
          <span>Highlight key phrases after summarizing</span>
        </label>

        <button type="submit">Save settings</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
